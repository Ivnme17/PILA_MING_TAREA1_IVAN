name: Tarea1
services:
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto_t1
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/log:/mosquitto/log
      - ./mosquitto/data:/mosquitto/data
    networks:
      - t1-lan

  node-red:
    image: nodered/node-red
    container_name: node-red_t1
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE:-Europe/Madrid}
    ports:
      - "${NODE_RED_PORT:-1880}:1880"
    volumes:
      - ./node-red/data:/data
    networks:
      - t1-lan
    depends_on:
      - mosquitto

# compose.yaml
  db:
    image: influxdb:2
    container_name: influxdb_t1
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    env_file:
      - .env
    secrets:
      - influxdb2-admin-username
      - influxdb2-admin-password
      - influxdb2-admin-token
    volumes:
      - ./influxdb2/data:/var/lib/influxdb2
      - ./influxdb2/config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/influxdb2-admin-username
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influxdb2-admin-password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influxdb2-admin-token
      DOCKER_INFLUXDB_INIT_ORG: sdb
      DOCKER_INFLUXDB_INIT_BUCKET: tarea1
    networks:
      - t1-lan
    depends_on:
      - node-red
  grafana:
    image: grafana/grafana
    container_name: grafana_t1
    environment:
      - .env
      - GF_SERVER_ROOT_URL=http://my.grafana.server/
      - GF_PLUGINS_PREINSTALL=grafana-clock-panel
    ports:
      - '3000:3000'
    volumes:
      - './grafana/data:/var/lib/grafana'  
    networks:
      - t1-lan
    depends_on:
      - db
    
secrets:
  influxdb2-admin-username:
    file: ./.env.influxdb2-admin-username
  influxdb2-admin-password:
    file: ./.env.influxdb2-admin-password
  influxdb2-admin-token:
    file: ./.env.influxdb2-admin-token
networks:
  t1-lan:
    driver: bridge